<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Erreur serveur - Ghalisam Boutique</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #f8fafc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-card {
            background: white;
            border-radius: 24px;
            padding: 56px 48px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(14, 15, 18, 0.10);
            max-width: 500px;
            width: 100%;
            border-top: 6px solid #db2777;
        }
        .error-code {
            font-size: 96px;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #db2777, #9333ea);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            margin-bottom: 8px;
        }
        .error-card h1 { font-size: 24px; color: #111827; margin: 12px 0 10px; }
        .error-card p { color: #6b7280; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
        .error-card a {
            display: inline-block;
            padding: 13px 32px;
            background: #db2777;
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
        }
        .error-card a:hover { background: #be185d; transform: translateY(-1px); }
        .error-card a:active { transform: translateY(0); }
        .logo { font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #9ca3af; text-transform: uppercase; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="logo">Ghalisam Boutique</div>
        <div class="error-code">500</div>
        <h1>Erreur serveur</h1>
        <p>Une erreur inattendue est survenue.<br>Le problème a été enregistré et nous travaillons à le résoudre. Réessayez dans quelques instants.</p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
