<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée - Galisham Boutique</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f6fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-card { background: white; border-radius: 20px; padding: 48px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.08); max-width: 480px; width: 90%; }
        .error-code { font-size: 80px; font-weight: 900; color: #e2e8f0; line-height: 1; }
        .error-card h1 { font-size: 22px; color: #111; margin: 12px 0 8px; }
        .error-card p { color: #64748b; font-size: 15px; margin-bottom: 24px; }
        .error-card a { display: inline-block; padding: 12px 28px; background: #3b82f6; color: white; border-radius: 10px; text-decoration: none; font-weight: 700; transition: background 0.2s; }
        .error-card a:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1>Page introuvable</h1>
        <p>La page que vous recherchez n'existe pas ou a été déplacée.</p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
