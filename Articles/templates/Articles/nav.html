{% load article_extras %}
<nav>
    <div class="nav-left">
        <div class="logo">Galisham Boutique</div>
        {% if user.is_superuser %}
        <a href="{% url 'admin_dashboard' %}">Admin</a>
        {% elif user.is_authenticated and user|has_livreur_profile %}
        <a href="{% url 'livreur_dashboard' %}">Livreur</a>
        {% endif %}
        {% if user.is_authenticated %}
        <a href="{% url 'profil' %}">Profil</a>
        <form method="post" action="{% url 'deconnexion' %}" style="display:inline">
            {% csrf_token %}
            <button type="submit" class="nav-btn" style="background:none;border:none;color:inherit;cursor:pointer;padding:inherit;font:inherit;">Déconnexion</button>
        </form>
        {% else %}
        <a href="{% url 'connexion' %}" class="nav-btn">Connexion</a>
        <a href="{% url 'register' %}" class="signup-btn">S'inscrire</a>
        {% endif %}
    </div>

    <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="nav-links" id="navLinks">
        <a href="{% url 'acceuil' %}">Accueil</a>
        <a href="{% url 'produit_list' %}">Articles</a>
        <a href="{% url 'commande' %}" class="cart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top: -2px;"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Panier
        </a>
    </div>
</nav>
<script>
    document.getElementById('hamburger')?.addEventListener('click', function() {
        document.getElementById('navLinks').classList.toggle('open');
    });
</script>
