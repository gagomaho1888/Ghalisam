{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Ghalisam Boutique</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body>
{% include 'Articles/nav.html' %}

<div class="auth-container">
    <h1>Connexion</h1>
    {% if error %}
    <div class="message">{{ error }}</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" placeholder="coraline" required>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="veuillez entrer votre mot de passe" required>

        <button type="submit">Se connecter</button>
    </form>

    <div style="text-align:center; margin-top:14px;">
        <a href="{% url 'mot_de_passe_oublie' %}" style="color:#3a7bd5; text-decoration:none; font-size:14px;">Mot de passe oublié ?</a>
    </div>

    <div class="link-row">
        <a href="{% url 'register' %}" class="secondary-btn">Créer un compte</a>
    </div>
</div>
{% include 'Articles/cookie_banner.html' %}
</body>
</html>
