{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Modifier livreur</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body>
{% include 'Articles/nav.html' %}
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <h3>Administration</h3>
        <a href="{% url 'admin_dashboard' %}">Tableau de bord</a>
        <a href="{% url 'toutes_commandes' %}">Commandes</a>
        <a href="{% url 'gestion_livreurs' %}" class="active">Livreurs</a>
        <a href="{% url 'gestion_boutique' %}">Gestion boutique</a>
        <a href="/admin/">Django Admin</a>
        <a href="{% url 'acceuil' %}">Retour au site</a>
    </aside>
    <main class="admin-main">
        <h1>Modifier livreur</h1>
        {% if messages %}
        <div class="admin-messages">
            {% for msg in messages %}
            <div class="admin-alert {{ msg.tags }}">{{ msg }}</div>
            {% endfor %}
        </div>
        {% endif %}
        <form method="post" class="admin-form">
            {% csrf_token %}
            <label>Nom d'utilisateur *</label>
            <input type="text" name="username" value="{{ livreur.user.username }}" required>
            <label>Nouveau mot de passe (laisser vide pour ne pas changer)</label>
            <input type="password" name="password">
            <label>Téléphone</label>
            <input type="text" name="telephone" value="{{ livreur.telephone }}">
            <button type="submit" class="btn-primary">Enregistrer</button>
            <a href="{% url 'gestion_livreurs' %}" class="btn-cancel">Annuler</a>
        </form>
    </main>
</div>
</body>
</html>
