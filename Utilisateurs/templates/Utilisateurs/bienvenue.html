{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue - Ghalisam</title>
    <link rel="stylesheet" href="{% static 'css/welcome.css' %}">
    </head>
<body>

<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="welcome-screen" id="welcome">
    <div class="content">
        <div class="logo-text">Ghalisam</div>
        <div class="welcome-line"></div>
        <div class="welcome-msg">Bienvenue</div>
        <div class="username">{{ prenom }}</div>
        <div class="spinner"></div>
    </div>
</div>

<script nonce="{{ csp_nonce }}">
    setTimeout(function() {
        document.getElementById('welcome').classList.add('exit');
    }, 3000);

    setTimeout(function() {
        window.location.href = "{% url 'acceuil' %}";
    }, 3500);
</script>

</body>
</html>
